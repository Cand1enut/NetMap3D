# NetMap3D on Ubuntu Server.
#
#   git clone <repo> /srv/netmap3d && cd /srv/netmap3d
#   docker build -f nos/Dockerfile.frr -t netmap3d/frr:latest nos/
#   docker compose -f deploy/docker-compose.yml up -d
#   → http://<server>:8080
#
# Read the note on the docker socket below before enabling real-NOS mode.
services:
  netmap3d:
    image: node:22-bookworm-slim
    container_name: netmap3d
    working_dir: /srv/netmap3d
    command: node server/server.js
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      # Real switch instances. Requires the docker socket mount below.
      NETMAP3D_NOS: "${NETMAP3D_NOS:-0}"
    volumes:
      - ../:/srv/netmap3d:ro
      # SECURITY: handing a container the docker socket is equivalent to giving
      # it root on the host — it can start any container, with any mount. That is
      # exactly what spawning FRR instances needs, and it is why NETMAP3D_NOS is
      # off unless you set it. On a machine you do not fully trust, run the
      # server under systemd on the host instead (deploy/netmap3d.service) so the
      # socket is never exposed to a container at all.
      - /var/run/docker.sock:/var/run/docker.sock
